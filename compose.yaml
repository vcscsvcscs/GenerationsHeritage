---
services:
  memgraph:
    image: "memgraph/memgraph-mage:latest"
    container_name: memgraph
    volumes:
      - mg_lib:/var/lib
      - mg_log:/var/log
      - mg_etc:/etc/memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    command: 
      - "--log-level=TRACE"
      - "--storage-mode=ON_DISK_TRANSACTIONAL"
      - "--storage-snapshot-interval-sec=86400"
      - "--storage-snapshot-retention-count=60"
      - "--storage-property-store-compression-enabled=true"
      - "--storage-property-store-compression-level=mid"
      - "--storage-snapshot-on-exit=true"
    environment:
      - MEMGRAPH_USER=<USERNAME>
      - MEMGRAPH_PASSWORD=<PASSWORD>
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 0;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 0s
  lab:
    image: memgraph/lab:latest
    container_name: memgraph-lab
    ports:
      - "3036:3000"
    depends_on:
      - memgraph
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
  db-adapter:
    image: vcscsvcscs/gheritage-db-adapter:latest
    container_name: db-adapter
    ports:
      - "5237:5237"
    depends_on:
      - memgraph
    environment:
      - HTTP_PORT=:5237
      - MEMGRAPH_URI=bolt://memgraph:7687
      - MEMGRAPH_USER=<USERNAME>
      - MEMGRAPH_PASSWORD=<PASSWORD>
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5237/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 0s
  backup:
    image: vcscsvcscs/gheritage-backup:latest
    container_name: backup
    restart: unless-stopped
    depends_on:
      memgraph:
        condition: service_healthy
    environment:
      - TZ=Europe/Budapest
      - MEMGRAPH_URI=bolt://memgraph:7687
      - MEMGRAPH_USER=<USERNAME>
      - MEMGRAPH_PASSWORD=<PASSWORD>
      - S3_ENDPOINT=https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - S3_BUCKET=<BUCKET>
      - S3_ACCESS_KEY_ID=<ACCESS_KEY_ID>
      - S3_SECRET_ACCESS_KEY=<SECRET_ACCESS_KEY>
      - S3_REGION=auto
      - S3_PREFIX=memgraph/
      - BACKUP_SCHEDULE=0 3 * * *
      - BACKUP_ON_START=false
      - BACKUP_RETENTION_COUNT=30
      # - BACKUP_AGE_RECIPIENT=<AGE_PUBLIC_KEY>
    healthcheck:
      test: ["CMD", "/backup", "healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 30s
volumes:
  mg_lib:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/data/memgraph/lib'
  mg_log:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/data/memgraph/log'
  mg_etc:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/data/memgraph/etc'
